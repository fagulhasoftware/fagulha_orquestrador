name: Relatar erro
description: Algo não funciona como deveria no Orquestrador Fagulha.
labels: ["erro"]
body:
  - type: markdown
    attributes:
      value: |
        Obrigado por relatar. **Não inclua chaves, tokens, e-mails, caminhos pessoais ou conteúdo
        confidencial** nas informações abaixo. Vulnerabilidades de segurança devem ser relatadas
        pela aba Security, não aqui.
  - type: textarea
    id: descricao
    attributes:
      label: O que aconteceu?
      description: Descreva o erro e o que você esperava que acontecesse.
    validations:
      required: true
  - type: textarea
    id: passos
    attributes:
      label: Passos para reproduzir
      placeholder: |
        1. Abrir o Orquestrador Fagulha
        2. Mencionar @codex com ...
        3. ...
    validations:
      required: true
  - type: input
    id: versao
    attributes:
      label: Versão da extensão
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: ambiente
    attributes:
      label: VS Code e sistema operacional
      placeholder: "VS Code 1.140, Windows 11"
    validations:
      required: true
  - type: dropdown
    id: agentes
    attributes:
      label: Agentes envolvidos
      multiple: true
      options:
        - Claude Code
        - Codex
        - Gemini CLI
        - Ollama
        - API OpenAI / compatível
        - API Anthropic
        - API Gemini
        - Nenhum / interface
  - type: dropdown
    id: nivel
    attributes:
      label: Nível de permissão
      options:
        - Manual
        - Parcial
        - Total
  - type: textarea
    id: registros
    attributes:
      label: Mensagens de erro (opcional)
      description: Copie o texto do erro exibido na sala. Revise antes de enviar e remova dados pessoais.
      render: text
